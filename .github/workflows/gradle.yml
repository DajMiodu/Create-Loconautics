# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Mmmmmm chezburger
    - name: Fetch mod jars into run/mods
      env:
        SABLE_JAR_URL: ${{ vars.SABLE_JAR_URL }}
        AERONAUTICS_JAR_URL: ${{ vars.AERONAUTICS_JAR_URL }}
        SIMULATED_JAR_URL: ${{ vars.SIMULATED_JAR_URL }}
      run: |
        mkdir -p run/mods
        for url in "$SABLE_JAR_URL" "$AERONAUTICS_JAR_URL" "$SIMULATED_JAR_URL"; do
          if [ -n "$url" ]; then
            curl -fsSLOJ --output-dir run/mods "$url"
          fi
        done
        ls -la run/mods

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload compiled mod
      uses: actions/upload-artifact@v4
      with:
        name: Create-Loconautics
        path: build/libs/*.jar
        if-no-files-found: error
        retention-days: 14
      
