plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.blamejared.com" }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll '--username', (project.findProperty('mcUser') ?: 'Lyc').toString()
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            jvmArguments.addAll '-Xms2G', '-Xmx8G'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var modJar = { String pattern ->
    def dir = file('run/mods')
    def jars = dir.isDirectory() ? dir.listFiles().findAll { it.isFile() } : []
    def regex = '(?i)^' + pattern.replace('.', '\\.').replace('*', '.*') + '$'
    def hits = jars.findAll { it.name ==~ regex }
    if (hits.size() != 1) {
        throw new GradleException("run/mods needs exactly one jar matching '${pattern}', found ${hits.size()}. " +
                "run/mods holds: ${jars ? jars*.name.sort().join(', ') : 'nothing'}")
    }
    return hits[0]
}

var optionalModJar = { String pattern ->
    def dir = file('run/mods')
    def regex = '(?i)^' + pattern.replace('.', '\\.').replace('*', '.*') + '$'
    def hits = dir.isDirectory() ? dir.listFiles().findAll { it.isFile() && it.name ==~ regex } : []
    return hits.size() == 1 ? hits[0] : null
}

var simulatedFromBundle = optionalModJar('simulated-*.jar') == null

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}")
    compileOnly files(modJar('sable-neoforge-*.jar'))
    compileOnly files(simulatedFromBundle ? 'deps/simulated-neoforge.jar' : modJar('simulated-*.jar'))

    compileOnly files('deps/sable-companion-common.jar')
    compileOnly files('deps/veil-neoforge.jar')
    compileOnly files('deps/sable-rapier.jar')

    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}")
    localRuntime("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}")
}

def registerExtract = { String taskName, String sourceJar, String entryPattern, String outputName ->
    tasks.register(taskName, Copy) {
        var source = modJar(sourceJar)
        from(zipTree(source)) {
            include entryPattern
        }
        eachFile { it.relativePath = new RelativePath(true, outputName) }
        includeEmptyDirs = false
        into 'deps'
    }
}

registerExtract('extractSableCompanion', 'sable-neoforge-*.jar', 'META-INF/jarjar/sable-companion-common-*.jar', 'sable-companion-common.jar')
registerExtract('extractSableRapier', 'sable-neoforge-*.jar', 'META-INF/jarjar/dev.ryanhcode.sable.sable-sable_rapier-*.jar', 'sable-rapier.jar')
registerExtract('extractVeil', 'sable-neoforge-*.jar', 'META-INF/jarjar/veil-neoforge-1.21.1-*.jar', 'veil-neoforge.jar')

if (simulatedFromBundle) {
    tasks.register('extractSimulated', Copy) {
        var bundle = modJar('create-aeronautics-bundled-*.jar')
        from(zipTree(bundle)) {
            include 'META-INF/jarjar/*simulated*.jar'
            exclude '**/*offroad*', '**/*aeronautics*'
        }
        eachFile { it.relativePath = new RelativePath(true, 'simulated-neoforge.jar') }
        includeEmptyDirs = false
        into 'deps'
    }
}

tasks.named('compileJava') {
    dependsOn 'extractSableCompanion'
    dependsOn 'extractVeil'
    dependsOn 'extractSableRapier'
    if (simulatedFromBundle) dependsOn 'extractSimulated'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
