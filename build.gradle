plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.blamejared.com" }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll '--username', (project.findProperty('mcUser') ?: 'Lyc').toString()
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            jvmArguments.addAll '-Xms2G', '-Xmx8G'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var runMods = file('run/mods')
var depsDir = file('deps')

var findModJars = { String pattern ->
    def regex = '(?i)^' + pattern.replace('.', '\\.').replace('*', '.*') + '$'
    runMods.isDirectory() ? runMods.listFiles().findAll { it.isFile() && it.name ==~ regex } : []
}

var optionalModJar = { String pattern ->
    def hits = findModJars(pattern)
    hits.size() == 1 ? hits[0] : null
}

var sableNeoforgeJar = optionalModJar('sable-neoforge-*.jar')
var simulatedJar = optionalModJar('simulated-*.jar')
var aeronauticsBundleJar = optionalModJar('create-aeronautics-bundled-*.jar')
var simulatedFromBundle = simulatedJar == null

var jarHitNames = ['sable-neoforge-*.jar', 'simulated-*.jar', 'create-aeronautics-bundled-*.jar']
        .collectEntries { [(it): findModJars(it)*.name.sort()] }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}")
    if (sableNeoforgeJar != null) {
        compileOnly files(sableNeoforgeJar)
    }
    compileOnly files(simulatedFromBundle ? 'deps/simulated-neoforge.jar' : simulatedJar)

    compileOnly files('deps/sable-companion-common.jar')
    compileOnly files('deps/veil-neoforge.jar')
    compileOnly files('deps/sable-rapier.jar')

    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}")
    localRuntime("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}")
}

var extractTaskNames = []

var registerExtract = { String taskName, File sourceJar, String entryPattern, String outputName ->
    tasks.register(taskName, Copy) {
        from(zipTree(sourceJar)) {
            include entryPattern
        }
        eachFile { it.relativePath = new RelativePath(true, outputName) }
        includeEmptyDirs = false
        into 'deps'
    }
    extractTaskNames << taskName
}

if (sableNeoforgeJar != null) {
    registerExtract('extractSableCompanion', sableNeoforgeJar, 'META-INF/jarjar/sable-companion-common-*.jar', 'sable-companion-common.jar')
    registerExtract('extractSableRapier', sableNeoforgeJar, 'META-INF/jarjar/dev.ryanhcode.sable.sable-sable_rapier-*.jar', 'sable-rapier.jar')
    registerExtract('extractVeil', sableNeoforgeJar, 'META-INF/jarjar/veil-neoforge-1.21.1-*.jar', 'veil-neoforge.jar')
}

if (simulatedFromBundle && aeronauticsBundleJar != null) {
    tasks.register('extractSimulated', Copy) {
        var bundle = aeronauticsBundleJar
        from(zipTree(bundle)) {
            include 'META-INF/jarjar/*simulated*.jar'
            exclude '**/*offroad*', '**/*aeronautics*'
        }
        eachFile { it.relativePath = new RelativePath(true, 'simulated-neoforge.jar') }
        includeEmptyDirs = false
        into 'deps'
    }
    extractTaskNames << 'extractSimulated'
}

tasks.named('compileJava') {
    extractTaskNames.each { dependsOn it }

    // Fail here
    doFirst {
        def problems = []

        jarHitNames.each { pattern, names ->
            if (names.size() > 1) {
                problems << "run/mods needs exactly one jar matching '${pattern}', found ${names.size()}: ${names.join(', ')}"
            }
        }
        if (jarHitNames['sable-neoforge-*.jar'].isEmpty()) {
            problems << "run/mods needs exactly one jar matching 'sable-neoforge-*.jar', found 0"
        }

        ['sable-companion-common.jar', 'veil-neoforge.jar', 'sable-rapier.jar', 'simulated-neoforge.jar'].each { name ->
            if (name == 'simulated-neoforge.jar' && !simulatedFromBundle) return
            if (!new File(depsDir, name).isFile()) {
                problems << "deps/${name} is missing (it is extracted from the Sable / create-aeronautics-bundled jar in run/mods, " +
                        "or must be provided in deps/)"
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Cannot compile - required mod jars are missing:\n  - " + problems.join("\n  - "))
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}